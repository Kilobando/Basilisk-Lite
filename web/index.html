<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basilisk Lite</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="sidebar">
        <header>
          <div>
            <p class="eyebrow">Identity</p>
            <p id="identity-key" class="mono"></p>
          </div>
          <button id="new-convo" class="primary">New chat</button>
        </header>
        <div id="conversations" class="conversation-list"></div>
      </div>
      <main id="chat">
        <div class="empty-state">
          <h1>Welcome to Basilisk Lite</h1>
          <p>Start a secure, peer-to-peer conversation. Messages stay on your devices.</p>
        </div>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h2>Start a conversation</h2>
        <label>Chat name <input id="chat-name" placeholder="e.g., Alice" /></label>
        <label>Conversation ID <input id="chat-id" placeholder="shared secret" /></label>
        <label>Peer public key <textarea id="peer-key" rows="3" placeholder="Base64-encoded public key"></textarea></label>
        <label>Relay URL <input id="relay-url" placeholder="ws://localhost:8787" value="ws://localhost:8787" /></label>
        <div class="modal-actions">
          <button id="cancel-modal">Cancel</button>
          <button id="create-chat" class="primary">Create</button>
        </div>
        <p class="hint">Share your public key and conversation ID out-of-band. The relay never stores messages.</p>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
